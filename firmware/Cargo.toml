[package]
name = "esp32c3-lcd144-keychain"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "esp32c3-lcd144-keychain"
harness = false # rust-analyzer가 테스트 하네스와 충돌하는 문제 방지

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.52"
embedded-hal = "1"
mipidsi = "0.10"
embedded-graphics = "0.8"

[build-dependencies]
embuild = "0.33"
